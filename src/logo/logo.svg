<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .brand-text {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-size: 118px;
        letter-spacing: 8px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="1200" fill="#F5EDE4"/>

  <!-- House outline -->
  <g fill="none" stroke="#7C8A5C" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- left roof + left wall -->
    <path d="M600,265 L350,462 L350,712"/>
    <!-- right roof (with chimney) + right wall -->
    <path d="M600,265 L737,372 L737,300 L792,300 L792,406 L850,462 L850,712"/>
  </g>

  <!-- Left person (green) -->
  <circle cx="460" cy="505" r="56" fill="#7C8A5C"/>
  <path d="M393,712 L393,608 Q393,558 460,558 Q527,558 527,608 L527,712 Z" fill="#7C8A5C"/>

  <!-- Right person (orange) -->
  <circle cx="742" cy="505" r="56" fill="#C1622D"/>
  <path d="M675,712 L675,608 Q675,558 742,558 Q809,558 809,608 L809,712 Z" fill="#C1622D"/>

  <!-- Door -->
  <path d="M560,712 L560,648 Q560,605 600,605 Q640,605 640,648 L640,712 Z" fill="#DCC6A4"/>
  <!-- door window panes -->
  <g stroke="#F5EDE4" stroke-width="5">
    <line x1="600" y1="632" x2="600" y2="668"/>
    <line x1="578" y1="650" x2="622" y2="650"/>
  </g>
  <rect x="578" y="632" width="44" height="36" fill="none" stroke="#F5EDE4" stroke-width="0"/>

  <!-- Logotype -->
  <text x="600" y="900" class="brand-text" text-anchor="middle">
    <tspan fill="#7C8A5C">FLAT</tspan><tspan fill="#C1622D">MATE</tspan>
  </text>
</svg>